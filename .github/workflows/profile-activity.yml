name: Update profile activity

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  snake:
    if: github.repository == 'XiaoDaiGua-Ray/XiaoDaiGua-Ray' && github.ref_name == github.event.repository.default_branch
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: ${{ runner.temp }}/contribution-snake-raw.svg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contribution-snake-source
          path: ${{ runner.temp }}/contribution-snake-raw.svg
          if-no-files-found: error
          retention-days: 1

  update:
    needs: snake
    if: ${{ !cancelled() && github.repository == 'XiaoDaiGua-Ray/XiaoDaiGua-Ray' && github.ref_name == github.event.repository.default_branch }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate from public activity
        id: activity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "users/${GITHUB_REPOSITORY_OWNER}/events/public?per_page=100" \
            > "${RUNNER_TEMP}/profile-events.json"
          python3 .github/scripts/update-activity.py "${GITHUB_REPOSITORY_OWNER}" \
            < "${RUNNER_TEMP}/profile-events.json"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.snake.result == 'success'
        id: download-snake
        with:
          name: contribution-snake-source
          path: ${{ runner.temp }}/profile-snake
      - name: Apply the profile palette to the snake
        if: steps.download-snake.outcome == 'success'
        id: style-snake
        run: |
          python3 .github/scripts/style-contribution-snake.py \
            "${RUNNER_TEMP}/profile-snake/contribution-snake-raw.svg" \
            assets/contribution-snake.svg assets/contribution-calendar.svg
      - name: Save updated profile
        if: ${{ !cancelled() && steps.activity.outcome == 'success' }}
        env:
          SNAKE_READY: ${{ steps.style-snake.outcome }}
        run: |
          git add README.md assets/activity.svg
          if [ "$SNAKE_READY" = success ]; then
            git add assets/contribution-snake.svg assets/contribution-calendar.svg
          fi
          if git diff --cached --quiet; then
            echo "Profile activity is already up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Refresh profile activity and contribution snake"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
